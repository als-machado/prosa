name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch appflowy_editor (onFocusReceived)
        run: python3 scripts/patch_appflowy_editor.py

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Build iOS (sem assinatura)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log

      - name: Verificar Runner.app
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "=== Runner.app em: $APP_PATH ==="
          ls -la "$APP_PATH/" 2>/dev/null || true

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app não encontrado — build falhou."
            tail -80 /tmp/build.log
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Info.plist ausente."
            ls -la "$APP_PATH/"
            exit 1
          fi

          echo "=== Frameworks ==="
          ls "$APP_PATH/Frameworks/" 2>/dev/null || echo "(pasta Frameworks ausente)"

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r prosa.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: prosa-ios-${{ github.sha }}
          path: prosa.ipa
          retention-days: 30
