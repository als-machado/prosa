name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch appflowy_editor (onFocusReceived)
        run: python3 scripts/patch_appflowy_editor.py

      - name: Versão do Xcode
        run: xcodebuild -version

      # Fase 1: flutter build ios configura pods e compila Dart corretamente.
      # CODE_SIGNING_ALLOWED=NO pula o embed de frameworks, mas não nos importa
      # aqui — só precisamos que pods e Dart fiquem prontos para a fase 2.
      - name: Fase 1 – preparar pods e compilar Dart
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build.log || true

      # Fase 2: xcodebuild archive sem CODE_SIGNING_ALLOWED=NO.
      # Isso preserva a fase "Embed Frameworks" e produz bundle completo.
      - name: Fase 2 – archive com frameworks embedados
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            archive \
            2>&1 | tee /tmp/xcode_build.log

      - name: Verificar Runner.app
        run: |
          APP_PATH="build/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
              -path "*/InstallationBuildProductsLocation/Applications/Runner.app" \
              -type d 2>/dev/null | head -1)
          fi

          echo "=== Runner.app: $APP_PATH ==="

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Runner.app não encontrado — build falhou."
            tail -80 /tmp/xcode_build.log
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Info.plist ausente."
            ls -la "$APP_PATH/"
            exit 1
          fi

          echo "=== Frameworks ==="
          ls "$APP_PATH/Frameworks/" 2>/dev/null || echo "(Frameworks ausente — app vai crashar no dispositivo)"

          if [ ! -d "$APP_PATH/Frameworks" ] || [ -z "$(ls -A "$APP_PATH/Frameworks" 2>/dev/null)" ]; then
            echo "Frameworks vazio — build incompleto."
            exit 1
          fi

          echo "Bundle completo. Copiando…"
          rm -rf build/ios/Release-iphoneos/Runner.app
          mkdir -p build/ios/Release-iphoneos
          cp -r "$APP_PATH" build/ios/Release-iphoneos/Runner.app

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r prosa.ipa Payload/
          rm -rf Payload

      - name: Validar e listar conteúdo do IPA
        run: |
          echo "=== Frameworks e executável no IPA ==="
          unzip -l prosa.ipa | grep -E "(\.framework|\.dylib|/Runner$)" | head -60

          if unzip -l prosa.ipa | grep -q "Runner\.app/Runner\.app"; then
            echo ""
            echo "ERRO: bundle aninhado detectado — Runner.app dentro de Runner.app!"
            exit 1
          fi
          echo "Estrutura OK (sem bundle aninhado)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: prosa-ios-${{ github.sha }}
          path: prosa.ipa
          retention-days: 30
