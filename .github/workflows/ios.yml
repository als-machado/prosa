name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Build iOS (sem assinatura)
        continue-on-error: true
        run: flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log

      - name: Verificar Runner.app
        run: |
          echo "=== Conteúdo de build/ios/Release-iphoneos/ ==="
          ls -la build/ios/Release-iphoneos/ 2>/dev/null || echo "Diretório não encontrado"

          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "Runner.app encontrado — xcodebuild teve sucesso."
          else
            echo "Runner.app não encontrado — o xcodebuild falhou de verdade."
            echo "=== Últimas 50 linhas do log ==="
            tail -50 /tmp/build.log
            exit 1
          fi

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r prosa.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: prosa-ios-${{ github.sha }}
          path: prosa.ipa
          retention-days: 30
