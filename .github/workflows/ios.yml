name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch appflowy_editor (onFocusReceived)
        run: python3 scripts/patch_appflowy_editor.py

      - name: Versão do Xcode
        run: xcodebuild -version

      # Fase 1: flutter build configura pods/SPM e compila Dart.
      # Com Flutter 3.44+ e SPM, plugins SPM ficam estáticos no executável
      # e Flutter.framework é embedado via Run Script (não afetado por
      # CODE_SIGNING_ALLOWED=NO). Verificamos se o bundle já está completo
      # antes de rodar a fase 2.
      - name: Fase 1 – preparar pods/SPM e compilar Dart
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build.log || true

      - name: Verificar bundle da fase 1
        id: fase1
        run: |
          APP="build/ios/iphoneos/Runner.app"
          echo "=== Estrutura da fase 1 ==="
          if [ ! -d "$APP" ]; then
            echo "Runner.app ausente após fase 1"
            tail -40 /tmp/flutter_build.log
            exit 1
          fi
          ls -la "$APP/"
          echo "=== Frameworks ==="
          ls "$APP/Frameworks/" 2>/dev/null || echo "(diretório Frameworks ausente)"
          FW_COUNT=$(ls "$APP/Frameworks/" 2>/dev/null | wc -l | tr -d ' ')
          echo "Frameworks encontrados: $FW_COUNT"
          if [ "$FW_COUNT" -gt 0 ]; then
            echo "completo=true" >> "$GITHUB_OUTPUT"
          else
            echo "completo=false" >> "$GITHUB_OUTPUT"
          fi

      # Fase 2: xcodebuild archive sem CODE_SIGNING_ALLOWED=NO.
      # Isso preserva o "Embed Frameworks" e produz bundle completo.
      # Remove o output da fase 1 primeiro para evitar bundle aninhado.
      - name: Fase 2 – archive com frameworks embedados
        if: steps.fase1.outputs.completo == 'false'
        run: |
          echo "Fase 1 incompleta (sem Frameworks). Executando archive…"
          rm -rf build/ios/iphoneos/Runner.app
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            archive \
            2>&1 | tee /tmp/xcode_build.log

      - name: Localizar e validar Runner.app
        run: |
          # Fase 1 completa: usa o bundle gerado pelo flutter build diretamente.
          # Fase 2 executada: usa o xcarchive (Runner.app da fase 1 foi deletado).
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
            echo "Usando bundle da fase 1"
          else
            APP_PATH="build/Runner.xcarchive/Products/Applications/Runner.app"
            if [ ! -d "$APP_PATH" ]; then
              APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
                -path "*/InstallationBuildProductsLocation/Applications/Runner.app" \
                -type d 2>/dev/null | head -1)
            fi
            echo "Usando bundle da fase 2: $APP_PATH"
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERRO: Runner.app não encontrado"
            tail -80 /tmp/xcode_build.log 2>/dev/null || tail -80 /tmp/flutter_build.log
            exit 1
          fi

          echo "=== Runner.app: $APP_PATH ==="
          ls -la "$APP_PATH/"

          # Detectar e achatar bundle aninhado (Runner.app/Runner.app/)
          if [ -d "$APP_PATH/Runner.app" ]; then
            echo "Bundle aninhado detectado — usando bundle interno"
            APP_PATH="$APP_PATH/Runner.app"
            echo "=== Bundle interno ==="
            ls -la "$APP_PATH/"
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERRO: Info.plist ausente"
            ls -la "$APP_PATH/" 2>/dev/null
            exit 1
          fi

          echo "=== Frameworks ==="
          ls "$APP_PATH/Frameworks/" 2>/dev/null || echo "(sem Frameworks)"

          if [ ! -d "$APP_PATH/Frameworks" ] || [ -z "$(ls -A "$APP_PATH/Frameworks" 2>/dev/null)" ]; then
            echo "ERRO: Frameworks vazios — bundle incompleto"
            tail -80 /tmp/xcode_build.log 2>/dev/null || tail -80 /tmp/flutter_build.log
            exit 1
          fi

          echo "Bundle OK. Copiando para staging…"
          rm -rf /tmp/runner_app_staging
          cp -r "$APP_PATH" /tmp/runner_app_staging

      # Flutter.framework hard-linka MobileCoreServices (depreciado iOS 14).
      # Se removido no iOS 26, o dyld mata o processo em <10ms antes de qualquer
      # código rodar. Tornamos o link weak para que o dyld ignore a ausência.
      # NÃO re-assinamos após o patch: assinar só o binário (sem o dir do
      # .framework) deixa o CodeResources com hashes velhos. AltServer substitui
      # todas as assinaturas na instalação e lida melhor com binários não-assinados
      # do que com assinaturas parcialmente inválidas.
      - name: Patch binários – weak link de frameworks removidos no iOS 26
        run: |
          APP=/tmp/runner_app_staging
          FW="$APP/Frameworks/Flutter.framework/Flutter"
          RUNNER="$APP/Runner"

          echo "=== Patch Runner ==="
          python3 scripts/patch_flutter_mobile_core.py "$RUNNER"

          echo ""
          echo "=== Patch de todos os frameworks embarcados ==="
          for fw_dir in "$APP/Frameworks"/*/; do
            fw_name=$(basename "$fw_dir" .framework)
            fw_bin="$fw_dir/$fw_name"
            if [ -f "$fw_bin" ]; then
              echo "--- $fw_name ---"
              python3 scripts/patch_flutter_mobile_core.py "$fw_bin"
            fi
          done

          echo ""
          echo "=== VERIFICAÇÃO: deps hard-linked restantes após patch ==="
          echo "(lista o que ainda é HARD e não é @rpath nem libSystem/libobjc/libc++)"
          echo "(deve estar VAZIA — qualquer /System/ ou /usr/lib/swift/ sem 'weak' aqui é candidato ao erro 85)"
          echo ""
          # otool neste macOS formata weak links como "..., weak)" (vírgula+weak dentro do parêntese
          # de versão), não como "(weak)" separado. Filtramos por ", weak)" ou pelo token "weak" no fim.
          for bin in "$RUNNER" "$FW"; do
            name=$(basename "$(dirname "$bin")")/$(basename "$bin")
            echo "--- $name ---"
            otool -L "$bin" \
              | tail -n +2 \
              | grep -v ", weak)" \
              | grep -v "(weak)" \
              | grep -v "@rpath/" \
              | grep -v "libSystem\.B\.dylib\|libobjc\.A\.dylib\|libc++\.1\|libc++abi" \
              | grep "/" \
              || echo "  (nenhum hard extra — OK)"
          done

          echo ""
          echo "=== Contagem weak/hard por binário ==="
          for bin in "$RUNNER" "$FW"; do
            name=$(basename "$bin")
            total=$( otool -L "$bin" | tail -n +2 | grep -c "/System\|/usr/lib/swift" || true )
            weak=$(  otool -L "$bin" | tail -n +2 | grep -c "weak" || true )
            hard=$(( total - weak ))
            echo "$name: $hard hard-system, $weak weak (total system: $total)"
          done

      - name: Empacotar IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -r /tmp/runner_app_staging Payload/Runner.app
          zip -r prosa.ipa Payload/
          rm -rf Payload

      - name: Validar IPA e inspecionar dependências
        run: |
          echo "=== Frameworks e executável no IPA ==="
          unzip -l prosa.ipa | grep -E "(\.framework|\.dylib|/Runner$)" | head -60

          if unzip -l prosa.ipa | grep -q "Runner\.app/Runner\.app"; then
            echo ""
            echo "ERRO: bundle aninhado no IPA — Runner.app dentro de Runner.app!"
            exit 1
          fi
          echo "Estrutura OK (sem bundle aninhado)"

          echo ""
          echo "=== Dependências de cada framework (otool -L) ==="
          APP=/tmp/runner_app_staging
          for fw in "$APP/Frameworks/"*.framework; do
            name=$(basename "$fw")
            binary_name="${name%.framework}"
            bin="$fw/$binary_name"
            echo "--- $name (bin: $binary_name) ---"
            if [ -f "$bin" ]; then
              otool -L "$bin" | head -20
            else
              echo "  [binário não encontrado: $bin]"
              ls "$fw/" 2>/dev/null
            fi
          done

          echo ""
          echo "=== Dependências do executável Runner ==="
          otool -L "$APP/Runner"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: prosa-ios-${{ github.sha }}
          path: prosa.ipa
          retention-days: 30
