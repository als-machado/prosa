name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch appflowy_editor (onFocusReceived)
        run: |
          python3 - <<'EOF'
import os

path = os.path.expanduser(
    '~/.pub-cache/hosted/pub.dev/appflowy_editor-6.2.0'
    '/lib/src/editor/editor_component/service/ime/delta_input_service.dart'
)
with open(path, 'r') as f:
    content = f.read()

if 'onFocusReceived' not in content:
    content = content.replace(
        '  @override\n  TextEditingValue? currentTextEditingValue;',
        '  @override\n  bool onFocusReceived() => false;\n\n'
        '  @override\n  TextEditingValue? currentTextEditingValue;'
    )
    with open(path, 'w') as f:
        f.write(content)
    print('Patch aplicado.')
else:
    print('Já estava corrigido.')
EOF

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Pod install
        run: cd ios && pod install && cd ..

      - name: Build iOS (sem assinatura)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            archive \
            2>&1 | tee /tmp/build.log

      - name: Verificar Runner.app
        run: |
          APP_PATH="build/Runner.xcarchive/Products/Applications/Runner.app"
          echo "=== Runner.app encontrado em: $APP_PATH ==="

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app não encontrado — build falhou."
            tail -80 /tmp/build.log
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Info.plist ausente — build incompleto."
            ls -la "$APP_PATH/"
            exit 1
          fi

          if [ ! -d "$APP_PATH/Frameworks" ]; then
            echo "Frameworks ausente — build incompleto."
            ls -la "$APP_PATH/"
            exit 1
          fi

          echo "Runner.app completo. Copiando para build/ios/Release-iphoneos/"
          mkdir -p build/ios/Release-iphoneos
          cp -r "$APP_PATH" build/ios/Release-iphoneos/Runner.app

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r prosa.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: prosa-ios-${{ github.sha }}
          path: prosa.ipa
          retention-days: 30
