name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Desativar Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Versão do Xcode e instalações disponíveis
        run: |
          xcodebuild -version
          ls /Applications/ | grep -i xcode || echo "nenhuma instalação encontrada"

      - name: Build iOS (sem assinatura)
        run: flutter build ios --release --no-codesign --verbose 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Mostrar erros do build
        if: failure()
        run: |
          grep -E "error:|CODE_SIGN|signing|DEVELOPMENT_TEAM|provision|Xcode_|xcframework" /tmp/build.log | grep -v "^note:" | head -150 || tail -200 /tmp/build.log

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r prosa.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: prosa-ios-${{ github.sha }}
          path: prosa.ipa
          retention-days: 30
