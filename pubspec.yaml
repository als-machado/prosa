name: prosa
description: "Editor de texto para escritores, com foco na criação de livros."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # File system
  file_picker: ^10.2.0

  # Text editing & markdown
  flutter_markdown: ^0.7.7
  re_editor: ^0.4.0

  # Git / Process
  process_run: ^1.2.1

  # UI
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # HTTP
  http: ^1.2.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  yaml: ^3.1.2

  cupertino_icons: ^1.0.8
  appflowy_editor: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
