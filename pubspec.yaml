name: prosa
description: "Editor de texto para escritores, com foco na criação de livros."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Storage
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2

  # File system
  file_picker: ^10.2.0

  # Text editing & markdown
  flutter_markdown: ^0.7.7
  # Modo texto do editor: re_editor desenha, re_highlight colore o Markdown
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  # Exportação de livros (EPUB, DOCX e ODT são ZIP; a capa pode precisar de
  # conversão; o PDF é o único que precisa de diagramação de verdade)
  archive: ^4.0.7
  image: ^4.5.4
  pdf: ^3.11.3

  # Git / Process
  process_run: ^1.2.1

  # UI
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # HTTP
  http: ^1.2.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  yaml: ^3.1.2

  cupertino_icons: ^1.0.8
  appflowy_editor: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Só nos testes: confere que todo XML gerado no EPUB é bem formado.
  xml: ^7.0.1
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    # Dicionários da verificação ortográfica (filtros de Bloom gerados por
    # scripts/build_dictionaries.py). Ver assets/dictionaries/LICENSES.md.
    - assets/dictionaries/pt_BR.bloom
    - assets/dictionaries/pt_BR.ngram.bloom
    - assets/dictionaries/en_US.bloom
    - assets/dictionaries/en_US.ngram.bloom
    # Miolo do PDF. As fontes internas do formato PDF só enxergam Latin-1 —
    # travessão e aspas curvas ficariam de fora. Ver assets/fonts/LICENSES.md.
    - assets/fonts/LiberationSerif-Regular.ttf
    - assets/fonts/LiberationSerif-Bold.ttf
    - assets/fonts/LiberationSerif-Italic.ttf
    - assets/fonts/LiberationSerif-BoldItalic.ttf

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  android: false
  remove_alpha_ios: true
